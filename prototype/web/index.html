<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b3d2e" />
  <title>Vitilla Power — Prototipo</title>
  <!-- Archivo AUTOCONTENIDO: CSS y JS incluidos. Solo abre este archivo y juega. -->
  <style>
:root {
  --green-deep: #0b3d2e;
  --green: #15875a;
  --green-light: #2ecc71;
  --sand: #e8d5a8;
  --red: #e23b3b;
  --blue: #1f6feb;
  --gold: #f5c542;
  --ink: #0e1a14;
  --paper: #f7f4ec;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  background: radial-gradient(circle at 50% 0%, #0f4d39, #08261c 70%);
  color: var(--paper);
  overscroll-behavior: none;
}

#app { height: 100%; display: flex; flex-direction: column; }

.screen {
  display: none;
  flex: 1;
  flex-direction: column;
  padding: 16px;
  max-width: 760px;
  width: 100%;
  margin: 0 auto;
}
.screen.active { display: flex; }

.topbar { text-align: center; margin-bottom: 12px; }
.topbar h1 {
  margin: 4px 0;
  font-size: clamp(26px, 7vw, 44px);
  letter-spacing: 2px;
  text-shadow: 3px 3px 0 var(--green-deep);
}
.topbar h1 span { color: var(--gold); }
.tagline { margin: 0; opacity: 0.8; font-size: 14px; }

.grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
  align-content: start;
  overflow-y: auto;
  padding: 4px;
}

.card {
  background: rgba(255,255,255,0.06);
  border: 2px solid transparent;
  border-radius: 16px;
  padding: 14px 10px;
  text-align: center;
  cursor: pointer;
  transition: transform .12s, border-color .12s, background .12s;
  user-select: none;
}
.card:active { transform: scale(0.96); }
.card.selected {
  border-color: var(--gold);
  background: rgba(245,197,66,0.14);
}
.card .emoji { font-size: 44px; line-height: 1; display: block; margin-bottom: 8px; }
.card .name { font-weight: bold; font-size: 15px; }
.card .desc { font-size: 12px; opacity: 0.75; margin-top: 4px; min-height: 28px; }
.card.create { border-style: dashed; border-color: rgba(255,255,255,0.3); }
.card .badge {
  display: inline-block; font-size: 10px; background: var(--blue);
  padding: 2px 6px; border-radius: 8px; margin-top: 6px;
}

.actions { display: flex; gap: 10px; margin-top: 12px; }
.btn {
  flex: 1;
  border: none;
  border-radius: 14px;
  padding: 14px 16px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: transform .1s, opacity .1s, filter .1s;
  color: white;
}
.btn:active { transform: translateY(2px); }
.btn.primary { background: var(--green-light); color: var(--ink); }
.btn.ghost { background: rgba(255,255,255,0.12); }
.btn.primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.small { flex: none; align-self: center; margin-top: 8px; padding: 8px 16px; font-size: 13px; }

#screen-game { padding: 8px; }
#hud {
  display: flex; gap: 8px; justify-content: space-between;
  margin-bottom: 8px;
}
.hud-item {
  flex: 1; background: rgba(0,0,0,0.3); border-radius: 10px;
  padding: 6px 4px; text-align: center;
}
.hud-label { display: block; font-size: 10px; text-transform: uppercase; opacity: 0.7; }
.hud-item span:last-child { font-size: 20px; font-weight: bold; }
.hud-item.power { background: rgba(245,197,66,0.18); }
.hud-item.power.active { animation: pulse 0.7s infinite alternate; }
@keyframes pulse { from { background: rgba(245,197,66,0.18);} to { background: rgba(245,197,66,0.5);} }

#game-canvas {
  width: 100%;
  flex: 1;
  background: linear-gradient(#bfe3ff 0%, #d9f0ff 45%, #6cbf6c 45%, #3f8f3f 100%);
  border-radius: 14px;
  display: block;
  touch-action: none;
}

.message {
  text-align: center;
  min-height: 30px;
  font-size: 22px;
  font-weight: bold;
  margin: 6px 0;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.4);
  transition: opacity .2s;
}

.game-controls { display: flex; }
.btn.swing {
  background: var(--red);
  font-size: 22px;
  padding: 18px;
  letter-spacing: 1px;
}
.btn.swing:disabled { opacity: 0.5; }

@media (max-width: 380px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
}
  </style>
</head>
<body>
  <div id="app">

    <!-- PANTALLA: SELECCIÓN DE PERSONAJE -->
    <section id="screen-character" class="screen active">
      <header class="topbar">
        <h1>VITILLA <span>POWER</span></h1>
        <p class="tagline">Selecciona tu personaje</p>
      </header>
      <div id="character-grid" class="grid"></div>
      <div class="actions">
        <button id="btn-random" class="btn ghost">🎲 Aleatorio</button>
        <button id="btn-to-field" class="btn primary" disabled>Continuar →</button>
      </div>
    </section>

    <!-- PANTALLA: SELECCIÓN DE CAMPO -->
    <section id="screen-field" class="screen">
      <header class="topbar">
        <h1>Selecciona el campo</h1>
        <p class="tagline">Más escenarios en camino…</p>
      </header>
      <div id="field-grid" class="grid"></div>
      <div class="actions">
        <button id="btn-back-character" class="btn ghost">← Atrás</button>
        <button id="btn-to-game" class="btn primary" disabled>¡Jugar! ⚾</button>
      </div>
    </section>

    <!-- PANTALLA: JUEGO -->
    <section id="screen-game" class="screen">
      <div id="hud">
        <div class="hud-item"><span class="hud-label">Carreras</span><span id="hud-runs">0</span></div>
        <div class="hud-item"><span class="hud-label">Outs</span><span id="hud-outs">0</span></div>
        <div class="hud-item"><span class="hud-label">Gillas</span><span id="hud-gillas">0</span></div>
        <div class="hud-item power" id="hud-power"><span class="hud-label">Power-up</span><span id="hud-power-val">—</span></div>
      </div>
      <canvas id="game-canvas"></canvas>
      <div id="message" class="message"></div>
      <div class="game-controls">
        <button id="btn-swing" class="btn swing">¡BATEAR!</button>
      </div>
      <button id="btn-quit" class="btn ghost small">Salir</button>
    </section>

  </div>

  <script>
/* ============================================================
   VITILLA POWER — Prototipo web (core loop de bateo)
   Flujo: Personaje -> Campo -> Juego (bateo por timing)
   Vanilla JS + Canvas, TODO en un solo archivo.
   ============================================================ */
"use strict";

/* ---------- Datos de personajes (roster "flow") ---------- */
const CHARACTERS = [
  { id: "diablo",  emoji: "😈", name: "El Diablo",  desc: "Palo legendario",        power: "Bola de Fuego" },
  { id: "tiguere", emoji: "😎", name: "El Tíguere",  desc: "Puro flow de esquina",   power: "Swing Doble" },
  { id: "capitan", emoji: "🧢", name: "El Capi",     desc: "El líder del cuadro",    power: "Ojo de Águila" },
  { id: "dona",    emoji: "💃", name: "La Doña",     desc: "No falla una",           power: "Cadera Caliente" },
  { id: "guaro",   emoji: "🍺", name: "El Guaro",    desc: "Pega con cualquier cosa", power: "Aplane Seguro" },
  { id: "flaco",   emoji: "🦴", name: "El Flaco",    desc: "Rápido como un rayo",    power: "Vitilla Freeze" },
  { id: "random",  emoji: "🎲", name: "Sorpresa",    desc: "Personaje aleatorio",    power: "???", isRandom: true },
  { id: "create",  emoji: "📸", name: "Crea el tuyo", desc: "Avatar por selfie (próximamente)", power: "El tuyo", isCreate: true },
];

/* ---------- Datos de campos ---------- */
const FIELDS = [
  { id: "stadium", emoji: "🏟️", name: "Baseball Stadium", desc: "Campo base del prototipo", sky: "#bfe3ff", grass: "#3f8f3f" },
  { id: "cristorey", emoji: "🏙️", name: "Cristo Rey",   desc: "Esquina de barrio (próximamente)", locked: true },
  { id: "losrios",   emoji: "🌆", name: "Los Ríos",     desc: "Próximamente", locked: true },
  { id: "sancarlos", emoji: "🏘️", name: "San Carlos",   desc: "Próximamente", locked: true },
];

const state = { character: null, field: FIELDS[0] };

function show(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ---------- Pantalla: personaje ---------- */
const characterGrid = document.getElementById("character-grid");
const btnToField = document.getElementById("btn-to-field");

function pickRandomPlayable() {
  const playable = CHARACTERS.filter((c) => !c.isRandom && !c.isCreate);
  return playable[Math.floor(Math.random() * playable.length)];
}

function renderCharacters() {
  characterGrid.innerHTML = "";
  CHARACTERS.forEach((c) => {
    const card = document.createElement("div");
    card.className = "card" + (c.isCreate ? " create" : "");
    card.innerHTML =
      '<span class="emoji">' + c.emoji + '</span>' +
      '<div class="name">' + c.name + '</div>' +
      '<div class="desc">' + c.desc + '</div>' +
      (c.isCreate ? '<span class="badge">SELFIE 📸</span>' : "");
    card.addEventListener("click", () => selectCharacter(c, card));
    characterGrid.appendChild(card);
  });
}

function selectCharacter(c, card) {
  let chosen = c;
  if (c.isRandom) chosen = pickRandomPlayable();
  if (c.isCreate) {
    alert(
      "✨ Crea tu propio personaje con un SELFIE.\n\n" +
      "Esta función está planificada para una fase futura (ver GDD §11.2).\n" +
      "Por ahora usarás un personaje del roster."
    );
    chosen = pickRandomPlayable();
  }
  state.character = chosen;
  document.querySelectorAll("#character-grid .card").forEach((el) => el.classList.remove("selected"));
  if (c.isRandom || c.isCreate) {
    const idx = CHARACTERS.indexOf(chosen);
    if (characterGrid.children[idx]) characterGrid.children[idx].classList.add("selected");
  } else {
    card.classList.add("selected");
  }
  btnToField.disabled = false;
}

document.getElementById("btn-random").addEventListener("click", () => {
  const chosen = pickRandomPlayable();
  selectCharacter(chosen, characterGrid.children[CHARACTERS.indexOf(chosen)]);
});
btnToField.addEventListener("click", () => show("screen-field"));

/* ---------- Pantalla: campo ---------- */
const fieldGrid = document.getElementById("field-grid");
const btnToGame = document.getElementById("btn-to-game");

function renderFields() {
  fieldGrid.innerHTML = "";
  FIELDS.forEach((f) => {
    const card = document.createElement("div");
    card.className = "card";
    card.style.opacity = f.locked ? 0.55 : 1;
    card.innerHTML =
      '<span class="emoji">' + f.emoji + '</span>' +
      '<div class="name">' + f.name + '</div>' +
      '<div class="desc">' + f.desc + '</div>' +
      (f.locked ? '<span class="badge" style="background:#777">🔒</span>' : "");
    card.addEventListener("click", () => {
      if (f.locked) return;
      state.field = f;
      document.querySelectorAll("#field-grid .card").forEach((el) => el.classList.remove("selected"));
      card.classList.add("selected");
      btnToGame.disabled = false;
    });
    fieldGrid.appendChild(card);
  });
}

document.getElementById("btn-back-character").addEventListener("click", () => show("screen-character"));
document.getElementById("btn-to-game").addEventListener("click", () => { show("screen-game"); Game.start(); });

/* ============================================================
   JUEGO: bateo por timing con vitilla "flotadora/giratoria"
   ============================================================ */
const Game = (() => {
  const canvas = document.getElementById("game-canvas");
  const ctx = canvas.getContext("2d");
  const msgEl = document.getElementById("message");
  const btnSwing = document.getElementById("btn-swing");

  const elRuns = document.getElementById("hud-runs");
  const elOuts = document.getElementById("hud-outs");
  const elGillas = document.getElementById("hud-gillas");
  const elPower = document.getElementById("hud-power");
  const elPowerVal = document.getElementById("hud-power-val");

  let W = 0, H = 0, dpr = 1;
  let runs, gillas, pitchInProgress, powerUpActive, swingLock;
  let raf = null;
  let pitchSpeed;

  const cap = { t: 0, x: 0, wobblePhase: 0, spin: 0, amp: 0, freq: 0 };

  const HIT_ZONE_Y = 0.80;
  const BASE_WINDOW = 0.055;
  const POWER_WINDOW_BONUS = 0.05;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function start() {
    resize();
    runs = 0; gillas = 0;
    pitchSpeed = 0.014;
    powerUpActive = false;
    updateHUD();
    setMessage("¡Dale a la vitilla! 🥎", "#fff");
    btnSwing.disabled = false;
    if (raf) cancelAnimationFrame(raf);
    loop();
    setTimeout(nextPitch, 900);
  }

  function updateHUD() {
    elRuns.textContent = runs;
    elOuts.textContent = gillas;
    elGillas.textContent = gillas;
    elPowerVal.textContent = powerUpActive ? ((state.character && state.character.power) || "¡Listo!") : "—";
    elPower.classList.toggle("active", powerUpActive);
  }

  function setMessage(txt, color) {
    msgEl.textContent = txt;
    msgEl.style.color = color || "#fff";
    msgEl.style.opacity = 1;
  }

  function nextPitch() {
    if (gillas >= 3) return gameOver();
    powerUpActive = gillas === 2;
    swingLock = false;
    pitchInProgress = true;
    cap.t = 0;
    cap.wobblePhase = Math.random() * Math.PI * 2;
    cap.spin = 0;
    cap.amp = (powerUpActive ? 0.07 : 0.12) + Math.random() * 0.05;
    cap.freq = 2 + Math.random() * 2.5;
    setMessage(powerUpActive ? ("⚡ ¡POWER-UP! " + state.character.power) : "", powerUpActive ? "#f5c542" : "#fff");
    updateHUD();
  }

  function currentWindow() {
    return BASE_WINDOW + (powerUpActive ? POWER_WINDOW_BONUS : 0);
  }

  function swing() {
    if (!pitchInProgress || swingLock) return;
    swingLock = true;
    const center = HIT_ZONE_Y;
    const diff = Math.abs(cap.t - center);
    const win = currentWindow();
    if (diff <= win * 0.35) {
      result("¡JONRÓN! 💥", "#f5c542", 2, true);
    } else if (diff <= win * 0.8) {
      result("¡HIT! ⚾", "#2ecc71", 1, true);
    } else if (diff <= win) {
      setMessage("Foul… 😬", "#ffd27f");
      pitchInProgress = false;
      setTimeout(nextPitch, 800);
    } else {
      gilla("¡GILLA! 🚫 Abanicaste");
    }
  }

  function result(txt, color, addRuns, connected) {
    runs += addRuns;
    pitchInProgress = false;
    if (connected) pitchSpeed = Math.min(pitchSpeed + 0.0012, 0.03);
    powerUpActive = false;
    setMessage(txt, color);
    spawnHitFx();
    updateHUD();
    setTimeout(nextPitch, 950);
  }

  function gilla(txt) {
    gillas += 1;
    pitchInProgress = false;
    powerUpActive = false;
    setMessage(txt, "#e23b3b");
    updateHUD();
    if (gillas >= 3) setTimeout(gameOver, 900);
    else setTimeout(nextPitch, 950);
  }

  function gameOver() {
    pitchInProgress = false;
    btnSwing.disabled = true;
    setMessage("⚾ ¡FUERA! Carreras: " + runs, "#fff");
    setTimeout(() => {
      setMessage("Carreras: " + runs + " — toca BATEAR para jugar otra vez", "#fff");
      btnSwing.disabled = false;
      btnSwing.textContent = "JUGAR OTRA VEZ";
      const restart = () => {
        btnSwing.textContent = "¡BATEAR!";
        btnSwing.removeEventListener("click", restart);
        start();
      };
      btnSwing.addEventListener("click", restart);
    }, 1200);
  }

  let hitFx = 0;
  function spawnHitFx() { hitFx = 1; }

  function loop() {
    update();
    draw();
    raf = requestAnimationFrame(loop);
  }

  function update() {
    if (pitchInProgress) {
      cap.t += pitchSpeed;
      cap.spin += 0.4;
      cap.wobblePhase += 0.12;
      if (cap.t >= 1) {
        if (!swingLock) gilla("¡GILLA! 🚫 La dejaste pasar");
        else { pitchInProgress = false; }
      }
    }
    if (hitFx > 0) hitFx = Math.max(0, hitFx - 0.04);
  }

  function capPos() {
    const y = (0.12 + cap.t * 0.88) * H;
    const wobble = Math.sin(cap.wobblePhase * cap.freq + cap.wobblePhase) * cap.amp * W * (cap.t * 0.8 + 0.2);
    const x = W / 2 + wobble;
    return { x, y };
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const sky = (state.field && state.field.sky) || "#bfe3ff";
    const grass = (state.field && state.field.grass) || "#3f8f3f";
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H * 0.45);
    ctx.fillStyle = grass;
    ctx.fillRect(0, H * 0.45, W, H * 0.55);

    ctx.fillStyle = "rgba(220,200,150,0.9)";
    ctx.beginPath();
    ctx.ellipse(W / 2, H * 0.30, W * 0.07, H * 0.03, 0, 0, Math.PI * 2);
    ctx.fill();

    // diana de strike
    ctx.save();
    ctx.translate(W / 2, H * 0.93);
    [22, 14, 6].forEach((r, i) => {
      ctx.fillStyle = i % 2 ? "#fff" : "#e23b3b";
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();

    // zona de bateo
    const win = currentWindow();
    const y1 = (0.12 + (HIT_ZONE_Y - win) * 0.88) * H;
    const y2 = (0.12 + (HIT_ZONE_Y + win) * 0.88) * H;
    ctx.fillStyle = powerUpActive ? "rgba(245,197,66,0.28)" : "rgba(46,204,113,0.20)";
    ctx.fillRect(0, y1, W, y2 - y1);
    ctx.strokeStyle = powerUpActive ? "rgba(245,197,66,0.9)" : "rgba(46,204,113,0.7)";
    ctx.lineWidth = 2;
    ctx.strokeRect(0, y1, W, y2 - y1);

    drawFigure(W / 2, H * 0.18, "🤾", 0.9);
    drawFigure(W * 0.30, H * 0.86, (state.character && state.character.emoji) || "🧍", 1.1);

    if (pitchInProgress) {
      const p = capPos();
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(cap.spin);
      const r = 10 + cap.t * 6;
      ctx.fillStyle = "#1f6feb";
      ctx.beginPath();
      ctx.ellipse(0, 0, r, r * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#0b3d8a";
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255,0.6)";
      ctx.lineWidth = 1.5;
      for (let a = 0; a < Math.PI; a += Math.PI / 6) {
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r * 0.55);
        ctx.lineTo(-Math.cos(a) * r, -Math.sin(a) * r * 0.55);
        ctx.stroke();
      }
      ctx.restore();
    }

    if (hitFx > 0) {
      ctx.fillStyle = "rgba(245,197,66," + (hitFx * 0.5) + ")";
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawFigure(x, y, emoji, scale) {
    ctx.save();
    ctx.font = Math.round(46 * scale) + "px serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(emoji, x, y);
    ctx.restore();
  }

  btnSwing.addEventListener("click", swing);
  canvas.addEventListener("pointerdown", (e) => { e.preventDefault(); swing(); });
  window.addEventListener("resize", () => resize());
  document.addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); swing(); } });

  return { start: start };
})();

document.getElementById("btn-quit").addEventListener("click", () => show("screen-character"));

/* ---------- Init ---------- */
renderCharacters();
renderFields();
show("screen-character");
  </script>
</body>
</html>
